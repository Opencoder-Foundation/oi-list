[package]
name = "backend"
version = "0.1.1"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9"
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["cors"] }
reqwest ={ version="0.13.4", features = ["form", "json"]}
dotenv = "0.15.0"